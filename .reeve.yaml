---
type: pipeline
name: deploy page - civet-org.github.io

when:
  workerGroup: { include: [soldier@midgar] }
  trigger: { include: [commit, action] }
  action: { include: [pages:civet-org.github.io:deploy] }

steps:
  - name: deploy page - civet-org.github.io
    task: "@reeve/npm-cli"
    params:
      GIT_USER_EMAIL: { env: forgejo/civet/documentation/email }
      GIT_USER_NAME: { env: forgejo/civet/documentation/name }
      GIT_REMOTE: { env: forgejo/civet/documentation/url }
    command: /bin/sh
    input: |
      set -e

      git config --global user.email "$GIT_USER_EMAIL"
      git config --global user.name "$GIT_USER_NAME"
      unset GIT_USER_EMAIL GIT_USER_NAME

      git clone "$GIT_REMOTE" --branch pages tmp
      COMMIT_HASH=$(git rev-parse --short HEAD)

      npm ci
      npm run build

      mv tmp/.git build
      cd build
      git add .
      git commit -m "Deploy website - based on $COMMIT_HASH"
      git push
